[project]
name = "two-way-sync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.136.1",
    "psycopg2-binary>=2.9.12",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["alembic/versions/"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "faker>=40.15.0",
    "httpx>=0.28.1",
    "pyrefly>=0.64.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
